<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Estaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Gestión de Estaciones</h2>
        <hr>
        
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="formEstaciones" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre Estación</label>
                        <input type="text" class="form-control" placeholder="Ej: Estación Central" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Zona</label>
                        <input type="text" class="form-control" placeholder="Ej: Zona 1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">ID Línea</label>
                        <input type="number" class="form-control" placeholder="Ej: 1" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Registrar Estación</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID Estación</th>
                        <th>Nombre</th>
                        <th>Zona</th>
                        <th>ID Línea</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Estación Central</td>
                        <td>Zona 1</td>
                        <td>1</td>
                        <td>
                            <button class="btn btn-warning btn-sm">Editar</button>
                            <button class="btn btn-danger btn-sm">Borrar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
