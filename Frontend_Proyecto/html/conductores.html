            <div id="sidebar-logo" class="logo text-center mb-4 fw-bold">MENÚ</div>

            <a href="lineas.html" id="nav-lineas" class="nav-link">Lineas</a>
            <a href="trenes.html" id="nav-trenes" class="nav-link">Trenes</a>
            <a href="personal.html" id="nav-personal" class="nav-link">Personal</a>
            <a href="pasajeros.html" id="nav-pasajeros" class="nav-link">Pasajeros</a>

            </header>

            <div id="action-bar" class="action-bar d-flex gap-2 mb-4">
                <button id="btn-crear" class="btn btn-primary">Crear</button>

            <div id="table-container" class="table-container table-responsive">

                            <th id="col-id">ID Conductor</th>
                            <th id="col-nombre">Nombre</th>
                            <th id="col-licencia">Licencia</th>
                            <th id="col-estado">Estado</th>

                    <tbody id="conductores-tbody">
                        <tr id="conductor-1">
                            <td>1</td>
                            <td>Carlos Pérez</td>
                            <td><span class="badge bg-primary">Tipo A</span></td>
                            <td><span class="badge bg-success">Activo</span></td>
                        </tr>
                        <tr id="conductor-2">
                            <td>2</td>
                            <td>María López</td>
                            <td><span class="badge bg-info text-dark">Tipo B</span></td>
                            <td><span class="badge bg-warning text-dark">Disponible</span></td>
