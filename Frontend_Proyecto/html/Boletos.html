<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Boletos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Registros de Boletos</h2>
        <hr>

        <div class="card mb-4 border-success">
            <div class="card-body">
                <form id="formBoleto" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">ID Boleto</label>
                        <input type="number" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Precio</label>
                        <input type="number" step="0.01" class="form-control" placeholder="Ej: 10.00" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ID Pasajero</label>
                        <input type="number" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Registrar Boleto</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table">
            <thead class="table-success">
                <tr>
                    <th>ID Boleto</th>
                    <th>Precio</th>
                    <th>Fecha</th>
                    <th>ID Pasajero</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>10.00</td>
                    <td>2026-03-01</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>5.00</td>
                    <td>2026-03-02</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>10.00</td>
                    <td>2026-03-02</td>
                    <td>3</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>5.00</td>
                    <td>2026-03-03</td>
                    <td>4</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
