<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Gestión de Personal</h2>
        <hr>

        <div class="card mb-4">
            <div class="card-body">
                <form id="formPersonal" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" placeholder="Ej: Pablo Santos" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cargo</label>
                        <select class="form-select" required>
                            <option value="">Seleccione un cargo...</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Conserje">Conserje</option>
                            <option value="Conductor">Conductor</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Guardar Personal</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID Personal</th>
                    <th>Nombre</th>
                    <th>Cargo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Pablo</td>
                    <td>Gerente</td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Borrar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
