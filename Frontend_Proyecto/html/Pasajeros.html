<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Pasajeros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Registros de Pasajeros</h2>
        <hr>

        <div class="card mb-4 border-success">
            <div class="card-body">
                <form id="formPasajero" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">ID Pasajero</label>
                        <input type="number" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Tipo de Pasajero</label>
                        <select class="form-select" required>
                            <option value="">Seleccione</option>
                            <option value="NIÑO">Niño</option>
                            <option value="ADULTO">Adulto</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Registrar Pasajero</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table">
            <thead class="table-success">
                <tr>
                    <th>ID Pasajero</th>
                    <th>Nombre</th>
                    <th>Tipo de Pasajero</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Juan Pérez</td>
                    <td>Adulto</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Ana López</td>
                    <td>Niño</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Carlos Méndez</td>
                    <td>Adulto</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>María González</td>
                    <td>Niño</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
