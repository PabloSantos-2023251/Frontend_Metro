<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Trenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Gestión de Trenes</h2>
        <hr>

        <div class="card mb-4">
            <div class="card-body">
                <form id="formTren" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Modelo</label>
                        <input type="text" class="form-control" placeholder="Ej: Metro 3000" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Capacidad</label>
                        <input type="number" class="form-control" placeholder="Ej: 200" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Estado</label>
                        <select class="form-select" required>
                            <option value="">Seleccionar...</option>
                            <option value="activo">Activo</option>
                            <option value="mantenimiento">Mantenimiento</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Guardar Tren</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table table-striped table-hover shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID Tren</th>
                    <th>Modelo</th>
                    <th>Capacidad</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Metro 3000</td>
                    <td>200 pasajeros</td>
                    <td><span class="badge bg-success">Activo</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Borrar</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Metro Express</td>
                    <td>150 pasajeros</td>
                    <td><span class="badge bg-warning text-dark">Mantenimiento</span></td>
                    <td>
                        <button class="btn btn-warning btn-sm">Editar</button>
                        <button class="btn btn-danger btn-sm">Borrar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
