<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Líneas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Gestión de Líneas</h2>
        <hr>
        
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form id="formLineas" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nombre de la Línea</label>
                        <input type="text" class="form-control" placeholder="Ej: Línea Norte" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Color</label>
                        <input type="text" class="form-control" placeholder="Ej: Rojo" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Longitud (km)</label>
                        <input type="number" step="0.01" class="form-control" placeholder="Ej: 15.50" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Registrar Línea</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre Línea</th>
                        <th>Color</th>
                        <th>Longitud (km)</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Línea A</td>
                        <td>Azul</td>
                        <td>12.50</td>
                        <td>
                            <button class="btn btn-warning btn-sm">Editar</button>
                            <button class="btn btn-danger btn-sm">Borrar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
