<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Mantenimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <a href="PaginaPrincipal.html" class="btn btn-secondary mb-3">← Volver</a>
        <h2>Registros de Mantenimiento</h2>
        <hr>

        <div class="card mb-4 border-success">
            <div class="card-body">
                <form id="formManto" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Fecha</label>
                        <input type="date" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">ID Tren</label>
                        <input type="number" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" placeholder="Ej: Cambio de frenos" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Registrar Mantenimiento</button>
                    </div>
                </form>
            </div>
        </div>

        <table class="table">
            <thead class="table-success">
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Descripción</th>
                    <th>Tren</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>2024-02-27</td>
                    <td>Limpieza de vías</td>
                    <td>Tren 5</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
